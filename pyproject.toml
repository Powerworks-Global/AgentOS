[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-pilot"
version = "0.1.0"
description = "AgentOS phase-1 pilot: headless coding pipeline on Claude Agent SDK"
requires-python = ">=3.10"
dependencies = ["claude-agent-sdk"]

[tool.setuptools.packages.find]
where = ["src"]
